<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Summer Hollow</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#a8d8e8; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  .card {
    background:rgba(250,244,226,0.92);
    border:1px solid rgba(122,94,58,0.35);
    border-radius:14px;
    box-shadow:0 6px 18px rgba(60,40,10,0.18);
    color:#4a3826;
    font-family:Georgia,'Times New Roman',serif;
  }

  #hud-zone {
    position:fixed; top:16px; left:16px; padding:8px 18px 9px 18px;
    font-size:19px; letter-spacing:1px; user-select:none; pointer-events:none;
    transition:opacity .4s ease; z-index:5;
  }
  #hud-zone .dot { display:inline-block; width:9px; height:9px; border-radius:50%;
    background:#c8763a; margin-right:9px; vertical-align:1px; }

  #hud-prompt {
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%);
    padding:10px 22px; font-size:17px; display:none; text-align:center;
    pointer-events:none; z-index:5; white-space:nowrap;
  }
  #hud-prompt kbd {
    font-family:Georgia,serif; background:#e8dcbf; border:1px solid #a8895c;
    border-bottom-width:3px; border-radius:6px; padding:1px 8px; margin:0 3px;
    font-size:15px; color:#3c2e1c;
  }
  #prompt-track {
    display:block; width:190px; height:8px; margin:7px auto 0 auto;
    background:rgba(122,94,58,0.25); border-radius:4px; overflow:hidden; display:none;
  }
  #prompt-fill { display:block; height:100%; width:0%; background:#c8763a; border-radius:4px; }

  #hud-banner {
    position:fixed; top:70px; left:50%; transform:translateX(-50%) scale(0.96);
    padding:12px 30px; font-size:22px; font-style:italic; color:#5a4326;
    opacity:0; transition:opacity .5s ease, transform .5s ease; pointer-events:none;
    z-index:6; text-align:center;
  }
  #hud-banner.show { opacity:1; transform:translateX(-50%) scale(1); }

  #hud-acorns {
    position:fixed; top:16px; right:16px; padding:7px 18px 8px 18px;
    font-size:15px; letter-spacing:0.5px; color:#4a3826;
    display:none; pointer-events:none; z-index:5;
  }
  #hud-bus {
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    padding:7px 20px 8px 20px; font-size:15px; letter-spacing:0.5px;
    display:none; pointer-events:none; z-index:5; white-space:nowrap;
    color:#4a3826;
  }

  #overlay {
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, rgba(30,24,10,0.05), rgba(30,24,10,0.42));
    transition:opacity .6s ease; pointer-events:none;
  }
  #overlay.hidden { opacity:0; }
  #overlay .card {
    padding:38px 56px 32px 56px; text-align:center; max-width:560px;
  }
  #overlay h1 {
    margin:0 0 6px 0; font-size:52px; letter-spacing:4px; color:#7a4a20;
    font-weight:normal; text-shadow:0 2px 0 rgba(255,240,200,0.8);
  }
  #overlay .premise { font-style:italic; font-size:18px; color:#6a543a; margin:0 0 22px 0; }
  #overlay .controls { font-size:16px; line-height:2.0; color:#4a3826; margin:0 0 22px 0; }
  #overlay .controls kbd {
    font-family:Georgia,serif; background:#efe4c6; border:1px solid #a8895c;
    border-bottom-width:3px; border-radius:6px; padding:1px 9px; margin:0 4px; font-size:14px;
  }
  #overlay .start {
    font-size:20px; color:#8a5a24; letter-spacing:2px; animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.35; } }

  #vignette {
    position:fixed; inset:0; pointer-events:none; z-index:4;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 58%, rgba(40,26,8,0.22) 100%);
  }
  #fade {
    position:fixed; inset:0; background:#04070f; opacity:0;
    pointer-events:none; z-index:15;
  }
  #card {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    z-index:18; pointer-events:none;
    background:radial-gradient(ellipse at 50% 55%, rgba(60,30,10,0.05), rgba(40,20,8,0.35));
  }
  #card .card-inner {
    background:rgba(252,244,224,0.94); border:1px solid rgba(122,94,58,0.4);
    border-radius:16px; padding:30px 52px 26px 52px; text-align:center;
    box-shadow:0 10px 40px rgba(40,20,5,0.35); color:#4a3826;
    font-family:Georgia,'Times New Roman',serif;
  }
  #card h2 { margin:0 0 14px 0; font-size:30px; letter-spacing:3px; font-weight:normal; color:#7a4a20; }
  #card ul { list-style:none; margin:0 0 14px 0; padding:0; font-size:17px; line-height:1.9; }
  #card ul li span.time { color:#a87a3a; font-style:italic; margin-left:10px; }
  #card .wake { margin:0; font-style:italic; font-size:19px; color:#8a5a24; }
  #err {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    color:#5a3210; font-family:Georgia,serif; font-size:18px; z-index:40; text-align:center;
    background:#f2e8cf; padding:40px;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="fade"></div>
<div id="card"><div class="card-inner">
  <h2>THE CATBUS ALWAYS RETURNS</h2>
  <ul id="card-list"></ul>
  <p class="wake">The valley is waking.</p>
</div></div>
<div id="hud-zone" class="card"><span class="dot"></span><span id="zone-name">Old House</span></div>
<div id="hud-acorns" class="card"></div>
<div id="hud-bus" class="card"></div>
<div id="hud-prompt" class="card"><span id="prompt-text"></span><span id="prompt-track"><span id="prompt-fill"></span></span></div>
<div id="hud-banner" class="card">The bucket is full.</div>
<div id="overlay">
  <div class="card">
    <h1>SUMMER HOLLOW</h1>
    <p class="premise">A summer valley, a giant old tree, and a lazy afternoon.</p>
    <p class="controls">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk &nbsp;·&nbsp;
      <kbd>E</kbd> interact (hold at the well) &nbsp;·&nbsp; <kbd>R</kbd> reset
    </p>
    <p class="start">Press Enter to Start</p>
  </div>
</div>
<div id="err"></div>

<script src="./assets/_shared/three/build/three.min.js"></script>
<script>
  if (typeof THREE === 'undefined') {
    var __fb = document.createElement('script');
    __fb.type = 'module';
    __fb.textContent = "import * as T from './vendor/three/three.module.min.js'; window.THREE = T; window.dispatchEvent(new Event('three-fallback-ready'));";
    document.head.appendChild(__fb);
  }
</script>
<script>
  function __boot() {
    if (typeof THREE !== 'undefined') { startGame(); return; }
    window.addEventListener('three-fallback-ready', function () { startGame(); }, { once: true });
    setTimeout(function () {
      if (typeof THREE === 'undefined') {
        var e = document.getElementById('err');
        e.style.display = 'flex';
        e.textContent = 'Could not load the Three.js runtime. Expected ./assets/_shared/three/build/three.min.js';
      }
    }, 6000);
  }
</script>
<script>
'use strict';
/* ============================================================
   SUMMER HOLLOW — a warm low-poly valley exploration game
   All motion is a pure function of time. No randomness.
   ============================================================ */
function startGame() {
try {

const T = THREE;

/* ---------------- small helpers ---------------- */
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
const lerp = (a, b, t) => a + (b - a) * t;
function sstep(a, b, x) { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); }
function hash1(n) { const s = Math.sin(n) * 43758.5453; return s - Math.floor(s); }
function hash2(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function dampA(cur, tgt, rate, dt) {
  let d = tgt - cur;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return cur + d * (1 - Math.exp(-rate * dt));
}
function dampN(cur, tgt, rate, dt) { return cur + (tgt - cur) * (1 - Math.exp(-rate * dt)); }
function easeC(t) { return t * t * (3 - 2 * t); }

/* ---------------- world constants ---------------- */
const RIDGE_H = 0.45, PADDY_WATER = 0.16, STREAM_WATER = 0.32;
const BRIDGE_DECK = 1.05, HOUSE_FLOOR = 0.95, YARD_H = 0.6;
const PADDY = { x0: 60, x1: 110, z0: -40, z1: 28 };
const RIDGE_XS = [60, 70, 80, 90, 100, 110];
const RIDGE_ZS = [-40, -26, -12, 2, 16, 28];
const BRIDGE_XS = [70, 150];
const SLOPE_LIMIT = 0.65;
const PLAYER_R = 0.3;
const SPAWN = { x: 24, z: 6 };
const CAM_YAW0 = Math.atan2(4, 5);
let realm = 'day'; // 'day' | 'night' — must be declared before any builder runs
const acornState = { count: 0 };
const ceremony = { active: false, done: false, t: 0 };
const treeRefs = {};
const ceremonyRefs = { added: [] };
let treeGrown = false, switchAt = null, loopSwitched = false, loopMode = 'three';


/* ---------------- deterministic road ---------------- */
const ROAD_PTS = [
  [28, 6], [36, 10], [44, 14], [52, 19], [58, 25], [62, 29.5], [66, 30.6],
  [70, 31.8], [70, 36], [70, 40], [70, 44], [70, 47], [76, 52], [86, 55],
  [97, 54], [110, 51], [123, 48], [134, 50], [144, 48], [150, 46], [150, 40],
  [150, 35], [150, 32], [154, 27], [160, 19], [168, 11], [176, 5], [182, 2], [186, 0.5]
];
function roadDist(x, z) {
  let best = 1e9;
  for (let i = 0; i < ROAD_PTS.length; i++) {
    const dx = x - ROAD_PTS[i][0], dz = z - ROAD_PTS[i][1];
    const d = dx * dx + dz * dz;
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}

/* ---------------- terrain math ---------------- */
function ridgeFactor(x, z) {
  let dx = 1e9, dz = 1e9;
  for (let i = 0; i < RIDGE_XS.length; i++) { const d = Math.abs(x - RIDGE_XS[i]); if (d < dx) dx = d; }
  for (let i = 0; i < RIDGE_ZS.length; i++) { const d = Math.abs(z - RIDGE_ZS[i]); if (d < dz) dz = d; }
  const d = Math.min(dx, dz);
  return 1 - sstep(0.55, 1.35, d);
}
function paddyMask(x, z) {
  const ix = sstep(56.5, 59.5, x) * (1 - sstep(110.5, 113.5, x));
  const iz = sstep(-43.5, -40.5, z) * (1 - sstep(28.5, 31.5, z));
  return ix * iz;
}
function terrainHeight(x, z) {
  let h = 0.35 * Math.sin(x * 0.045 + 1.7) * Math.cos(z * 0.06 + 0.4)
        + 0.22 * Math.sin(x * 0.11 + 0.3) * Math.sin(z * 0.09 + 2.0)
        + 0.12 * Math.sin(x * 0.023 + 0.8) * Math.cos(z * 0.017 + 1.1);
  const dx = Math.min(x, 200 - x), dz = Math.min(70 + z, 70 - z);
  const e = Math.max(1 - sstep(2, 16, dx), 1 - sstep(2, 14, dz));
  h += e * e * 14 + e * 2.0;
  const dh = Math.hypot(x - 20, z - 0.5);
  h = lerp(h, YARD_H, 1 - sstep(9, 19, dh));
  const pm = paddyMask(x, z);
  if (pm > 0) h = lerp(h, lerp(0, RIDGE_H, ridgeFactor(x, z)), pm);
  const az = Math.abs(z - 40);
  const sIn = 1 - sstep(7, 13, az);
  if (sIn > 0) {
    const ch = 1 - sstep(2.6, 5.8, az);
    h = lerp(h, lerp(0.8, -0.35, ch), Math.max(sIn, ch));
  }
  const dg = Math.hypot(x - 185, z);
  h = lerp(h, 0.5, (1 - sstep(6, 13, dg)) * 0.85);
  for (let i = 0; i < BRIDGE_XS.length; i++) {
    const ax = Math.abs(x - BRIDGE_XS[i]);
    if (ax < 2.6 && az > 4.0 && az < 7.4) {
      const t = (1 - sstep(4.0, 7.4, az)) * (1 - sstep(1.2, 2.6, ax));
      h = lerp(h, BRIDGE_DECK - 0.12, t);
    }
  }
  return h;
}
function groundDay(x, z) {
  for (let i = 0; i < BRIDGE_XS.length; i++) {
    if (Math.abs(x - BRIDGE_XS[i]) < 1.35 && Math.abs(z - 40) < 4.5) return BRIDGE_DECK;
  }
  if (x > 15.5 && x < 24.5 && z > -2 && z < 4) return HOUSE_FLOOR;
  if (x > 15.8 && x < 24.2 && z >= 4 && z < 6.2) return HOUSE_FLOOR;
  if (x > 19 && x < 21.6 && z >= 6.2 && z < 7.16) return lerp(HOUSE_FLOOR, YARD_H, (z - 6.2) / 0.96);
  return terrainHeight(x, z);
}
function groundNight(x, z) {
  let h = terrainNightHeight(x, z);
  if (!treeGrown) return h;
  const dx = x - S4_PLATFORM.x, dz = z - S4_PLATFORM.z;
  const d = Math.hypot(dx, dz);
  const hint = P.y;
  let best = null;
  if (d > 1.2 && d < S4_PLATFORM.r + 0.1) best = S4_PLATFORM.top;                       // wooden crown platform
  if (d >= 1.95 && d <= 5.85) {                                                        // spiral canopy road
    const ang = Math.atan2(dz, dx);
    const base = (-Math.PI - ang) / (2.5 * 2 * Math.PI);
    for (let k = 0; k < 4; k++) {
      const s = base + 0.4 * k;
      if (s < 0 || s > 1) continue;
      const wh = 0.55 + 17.75 * s;
      if (best === null || Math.abs(wh - hint) < Math.abs(best - hint)) best = wh;
    }
  }
  if (best !== null && Math.abs(best - hint) < 1.3) return best;
  return h;
}
function groundHeight(x, z) {
  return realm === 'day' ? groundDay(x, z) : groundNight(x, z);
}

/* ---------------- renderer / scene ---------------- */
const app = document.getElementById('app');
let renderer;
try {
  renderer = new T.WebGLRenderer({ antialias: true });
} catch (err) {
  const e = document.getElementById('err');
  e.style.display = 'flex';
  e.textContent = 'WebGL is not available in this browser.';
  throw err;
}
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.setClearColor(0xa8d8e8);
app.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.fog = new T.Fog(0xe6ecd0, 70, 235);

const camera = new T.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 700);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* sky dome */
(function makeSky() {
  const g = new T.SphereGeometry(430, 20, 14);
  const pos = g.attributes.position;
  const cols = new Float32Array(pos.count * 3);
  const cH = new T.Color(0xf3eed2), cZ = new T.Color(0x7cc0e4), c = new T.Color();
  for (let i = 0; i < pos.count; i++) {
    c.copy(cH).lerp(cZ, sstep(-20, 190, pos.getY(i)));
    cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new T.BufferAttribute(cols, 3));
  const m = new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide, fog: false }));
  m.frustumCulled = false;
  scene.add(m);
  const sun = new T.Mesh(new T.CircleGeometry(24, 24), new T.MeshBasicMaterial({ color: 0xfff3c4, fog: false }));
  sun.position.set(-330, 175, 130);
  sun.lookAt(0, 0, 0);
  scene.add(sun);
  const halo = new T.Mesh(new T.CircleGeometry(44, 24), new T.MeshBasicMaterial({ color: 0xfff8d8, fog: false, transparent: true, opacity: 0.35 }));
  halo.position.set(-330, 175, 130);
  halo.lookAt(0, 0, 0);
  scene.add(halo);
})();

/* lights */
const hemi = new T.HemisphereLight(0xd8ecff, 0x9ab06a, 0.85);
scene.add(hemi);
const sunL = new T.DirectionalLight(0xffe2ae, 1.25);
sunL.position.set(-85, 110, 50);
sunL.target.position.set(100, 0, 0);
sunL.castShadow = true;
sunL.shadow.mapSize.set(2048, 2048);
sunL.shadow.camera.left = -160; sunL.shadow.camera.right = 160;
sunL.shadow.camera.top = 130; sunL.shadow.camera.bottom = -130;
sunL.shadow.camera.near = 30; sunL.shadow.camera.far = 430;
sunL.shadow.bias = -0.0004;
sunL.shadow.normalBias = 0.9;
scene.add(sunL);
scene.add(sunL.target);

/* ---------------- materials ---------------- */
const MAT = {
  wood:      new T.MeshLambertMaterial({ color: 0x9c7f5e, flatShading: true }),
  woodDark:  new T.MeshLambertMaterial({ color: 0x6e5638, flatShading: true }),
  woodDeck:  new T.MeshLambertMaterial({ color: 0xa5834f, flatShading: true }),
  roofA:     new T.MeshLambertMaterial({ color: 0xb3593f, flatShading: true }),
  roofB:     new T.MeshLambertMaterial({ color: 0xa84f38, flatShading: true }),
  roofRidge: new T.MeshLambertMaterial({ color: 0x8a4a36, flatShading: true }),
  stone:     new T.MeshLambertMaterial({ color: 0x8f857a, flatShading: true }),
  bamboo:    new T.MeshLambertMaterial({ color: 0xc2a15f, flatShading: true }),
  cloth:     new T.MeshLambertMaterial({ color: 0xf5f2ea, side: T.DoubleSide, flatShading: true }),
  waterS:    new T.MeshLambertMaterial({ color: 0x4f9d99, transparent: true, opacity: 0.85, flatShading: true }),
  waterP:    new T.MeshLambertMaterial({ color: 0x63a08e, transparent: true, opacity: 0.8, flatShading: true }),
  white:     new T.MeshLambertMaterial({ color: 0xffffff, flatShading: true }),
  darkHollow:new T.MeshBasicMaterial({ color: 0x14100c }),
  straw:     new T.MeshLambertMaterial({ color: 0xdcb56e, flatShading: true }),
  frog:      new T.MeshLambertMaterial({ color: 0x6da84e, flatShading: true }),
  frogEye:   new T.MeshLambertMaterial({ color: 0x20301c, flatShading: true })
};

/* ---------------- terrain mesh ---------------- */
(function makeTerrain() {
  let g = new T.PlaneGeometry(200, 140, 150, 105);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const wx = p.getX(i) + 100, wz = p.getZ(i);
    p.setY(i, terrainHeight(wx, wz));
  }
  g.translate(100, 0, 0);
  g = g.toNonIndexed();
  g.computeVertexNormals();
  const pos = g.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const c = new T.Color();
  for (let f = 0; f < pos.count; f += 3) {
    const cx = (pos.getX(f) + pos.getX(f + 1) + pos.getX(f + 2)) / 3;
    const cy = (pos.getY(f) + pos.getY(f + 1) + pos.getY(f + 2)) / 3;
    const cz = (pos.getZ(f) + pos.getZ(f + 1) + pos.getZ(f + 2)) / 3;
    faceColor(cx, cy, cz, c);
    for (let k = 0; k < 3; k++) {
      colors[(f + k) * 3] = c.r; colors[(f + k) * 3 + 1] = c.g; colors[(f + k) * 3 + 2] = c.b;
    }
  }
  g.setAttribute('color', new T.BufferAttribute(colors, 3));
  const mesh = new T.Mesh(g, new T.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
  mesh.receiveShadow = true;
  scene.add(mesh);
})();

function faceColor(x, y, z, out) {
  let r = 0.47, g = 0.64, b = 0.30;                       // meadow grass
  const n = hash2(x * 0.37, z * 0.53);
  const v = 0.90 + 0.18 * n;
  const hilly = sstep(1.5, 9, y);
  r = lerp(r, 0.66, hilly * 0.8); g = lerp(g, 0.60, hilly * 0.8); b = lerp(b, 0.34, hilly * 0.8); // dry hill grass
  if (x > 147) { r = 0.36; g = 0.52; b = 0.26; }          // forest floor
  const pm = paddyMask(x, z);
  if (pm > 0.45) {
    if (ridgeFactor(x, z) > 0.35) { r = 0.55; g = 0.72; b = 0.35; }
    else { r = 0.36; g = 0.44; b = 0.28; }                // paddy mud
  }
  const az = Math.abs(z - 40);
  if (az < 4.9) {
    if (y < 0.36) { r = 0.42; g = 0.42; b = 0.33; }       // wet bed
    else { r = 0.62; g = 0.56; b = 0.42; }                // sandy bank
  }
  if (az > 4.6 && pm < 0.4) {
    const dr = roadDist(x, z);
    if (dr < 2.8) {
      const t = (1 - sstep(1.5, 2.8, dr)) * 0.9;
      r = lerp(r, 0.63, t); g = lerp(g, 0.50, t); b = lerp(b, 0.33, t);
    }
  }
  const dh = Math.hypot(x - 20, z - 0.5);
  if (dh < 11) {
    const t = (1 - sstep(5, 11, dh)) * 0.65;
    r = lerp(r, 0.67, t); g = lerp(g, 0.57, t); b = lerp(b, 0.40, t);
  }
  const dg = Math.hypot(x - 185, z);
  if (dg < 12) {
    const t = (1 - sstep(5, 12, dg)) * 0.5;
    r = lerp(r, 0.52, t); g = lerp(g, 0.46, t); b = lerp(b, 0.28, t);
  }
  out.setRGB(clamp(r * v, 0, 1), clamp(g * v, 0, 1), clamp(b * v, 0, 1));
}

/* ---------------- water ---------------- */
const waterAnims = [];
function addWater(geo, mat, x, y, z, amp, kx, kz, sp) {
  const base = new Float32Array(geo.attributes.position.array);

/* ---------------- dirt road ribbon ---------------- */
(function makeRoad() {
  const pts = [];
  for (let i = 0; i < ROAD_PTS.length; i++) pts.push(new T.Vector2(ROAD_PTS[i][0], ROAD_PTS[i][1]));
  const curve = new T.CatmullRomCurve3(pts.map(p2 => new T.Vector3(p2.x, 0, p2.y)), false, 'catmullrom', 0.4);
  const N = 260, samples = [];
  for (let i = 0; i <= N; i++) {
    const p = curve.getPoint(i / N);
    const t = curve.getTangent(i / N);
    samples.push({ x: p.x, z: p.z, tx: t.x, tz: t.z });
  }
  const posArr = [], colArr = [], idxArr = [];
  const W = 1.3;
  let vi = 0;
  for (let i = 0; i < N; i++) {
    const a = samples[i], b = samples[i + 1];
    const az = Math.abs((a.z + b.z) / 2 - 40);
    if (az < 4.4) continue;
    const c = new T.Color();
    const shades = [0.94, 1.02, 0.97, 1.05];
    c.setRGB(0.63 * shades[i % 4], 0.50 * shades[i % 4], 0.33 * shades[i % 4]);
    const quad = [];
    for (const [s, sign] of [[a, -1], [a, 1], [b, -1], [b, 1]]) {
      const px = -s.tz * sign * W, pz = s.tx * sign * W;
      const x = s.x + px, z = s.z + pz;
      const y = terrainHeight(x, z) + 0.06;
      quad.push([x, y, z]);
    }
    for (const v of quad) { posArr.push(v[0], v[1], v[2]); colArr.push(c.r, c.g, c.b); }
    idxArr.push(vi, vi + 1, vi + 2, vi + 1, vi + 3, vi + 2);
    vi += 4;
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(posArr, 3));
  g.setAttribute('color', new T.Float32BufferAttribute(colArr, 3));
  g.setIndex(idxArr);
  g.computeVertexNormals();
  const mesh = new T.Mesh(g, new T.MeshLambertMaterial({ vertexColors: true, flatShading: true, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }));
  mesh.receiveShadow = true;
  scene.add(mesh);
})();

/* ---------------- geometry merge helper ---------------- */
function mergeGeoms(list) {
  const pos = [], norm = [], uv = [], idx = [];
  let off = 0;
  for (const g of list) {
    const p = g.attributes.position, n = g.attributes.normal, u = g.attributes.uv;
    for (let i = 0; i < p.count; i++) {
      pos.push(p.getX(i), p.getY(i), p.getZ(i));
      norm.push(n.getX(i), n.getY(i), n.getZ(i));
      uv.push(u ? u.getX(i) : 0, u ? u.getY(i) : 0);
    }
    if (g.index) { for (let i = 0; i < g.index.count; i++) idx.push(g.index.getX(i) + off); }
    else { for (let i = 0; i < p.count; i++) idx.push(i + off); }
    off += p.count;
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new T.Float32BufferAttribute(norm, 3));
  g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

/* ---------------- instancing helper ---------------- */
const dummy = new T.Object3D();
function makeInstanced(geo, items, shadow, parent) {
  if (!items.length) return null;
  const m = new T.InstancedMesh(geo, MAT.white, items.length);
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    dummy.position.set(it.x, it.y, it.z);
    dummy.rotation.set(it.rx || 0, it.ry || 0, it.rz || 0);
    dummy.scale.set(it.sx !== undefined ? it.sx : (it.s || 1), it.sy !== undefined ? it.sy : (it.s || 1), it.sz !== undefined ? it.sz : (it.s || 1));
    dummy.updateMatrix();
    m.setMatrixAt(i, dummy.matrix);
    m.setColorAt(i, it.c || new T.Color(0xffffff));
  }
  m.instanceMatrix.needsUpdate = true;
  if (m.instanceColor) m.instanceColor.needsUpdate = true;
  m.frustumCulled = false;
  m.castShadow = !!shadow;
  (parent || scene).add(m);
  return m;
}

/* ---------------- wooden direction signposts ---------------- */
function makeSlatMesh(name, tx, tz, px, pz, y) {
  const bearing = Math.atan2(tz - pz, tx - px);
  const cnv = document.createElement('canvas');
  cnv.width = 256; cnv.height = 64;
  const c2 = cnv.getContext('2d');
  c2.fillStyle = '#6e5638';
  c2.fillRect(0, 0, 256, 64);
  c2.strokeStyle = '#4a3826';
  c2.lineWidth = 6;
  c2.strokeRect(3, 3, 250, 58);
  c2.fillStyle = '#ffdf9e';
  c2.font = 'bold 30px Georgia';
  c2.textAlign = 'left';
  c2.textBaseline = 'middle';
  c2.fillText(name, 14, 34);
  c2.fillText('\u25B6', 208, 34);
  const slat = new T.Mesh(
    new T.BoxGeometry(1.15, 0.28, 0.05),
    new T.MeshBasicMaterial({ map: new T.CanvasTexture(cnv) })
  );
  slat.position.y = y;
  slat.rotation.y = -bearing;
  slat.castShadow = true;
  return slat;
}
function makeSignpost(parent, x, z, yBase, slats) {
  const gy = yBase !== undefined ? yBase : groundHeight(x, z);
  const g = new T.Group();
  g.position.set(x, gy, z);
  parent.add(g);
  const post = new T.Mesh(new T.CylinderGeometry(0.07, 0.09, 1.9, 6), new T.MeshLambertMaterial({ color: 0x6e5638, flatShading: true }));
  post.position.y = 0.95;
  post.castShadow = true;
  g.add(post);
  const slatMeshes = [];
  slats.forEach((s, i) => {
    const slat = makeSlatMesh(s.name, s.tx, s.tz, x, z, 1.66 - i * 0.3);
    g.add(slat);
    slatMeshes.push({ name: s.name, mesh: slat });
  });
  return { group: g, slatMeshes };
}

function segClosest(px, pz, s) {
  const dx = s.bx - s.ax, dz = s.bz - s.az;
  const L2 = dx * dx + dz * dz;
  let t = L2 > 0 ? ((px - s.ax) * dx + (pz - s.az) * dz) / L2 : 0;
  t = clamp(t, 0, 1);
  return { x: s.ax + dx * t, z: s.az + dz * t };
}

function nightPathDist(x, z) {
  let best = 1e9;
  for (let i = 0; i < NIGHT_PATH_PTS.length; i++) {
    const dx = x - NIGHT_PATH_PTS[i][0], dz = z - NIGHT_PATH_PTS[i][1];
    const d = dx * dx + dz * dz;
    if (d < best) best = d;

function terrainNightBase(x, z) {
  let h = 0.4 * Math.sin(x * 0.05 + 0.7) * Math.cos(z * 0.055 + 1.1)
        + 0.25 * Math.sin(x * 0.09 + 2.2) * Math.sin(z * 0.08 + 0.5)
        + 0.15 * Math.sin(x * 0.021) * Math.cos(z * 0.019 + 2.0);
  const dx = Math.min(x, NIGHT_MAP.x1 - x), dz = Math.min(NIGHT_MAP.z1 + z, NIGHT_MAP.z1 - z);
  const e = Math.max(1 - sstep(2, 18, dx), 1 - sstep(2, 15, dz));
  h += e * e * 16 + e * 2.2;
  const dg = Math.hypot(x - 120, z - 20);
  h = lerp(h, 0.55, (1 - sstep(8, 16, dg)) * 0.9);
  const dh = Math.hypot(x - 9, z);
  h = lerp(h, 0.5, (1 - sstep(5, 12, dh)) * 0.85);
  // the stream that wears the moon: shallow water along z = -30, east country
  const sx = sstep(140, 168, x);
  if (sx > 0) {
    const az2 = Math.abs(z + 30);
    const ch2 = 1 - sstep(2.4, 5.2, az2);
    const sIn2 = 1 - sstep(6.5, 11, az2);
    h = lerp(h, lerp(0.75, -0.4, ch2), Math.max(sIn2, ch2) * sx);
  }
  return h;
}

const BUS_STOPS = {
  S1: { name: 'Tree-Hollow Stop', sign: 'TREE-HOLLOW', x: 18, z: -6 },
  S2: { name: 'Glade Stop', sign: 'GLADE', x: 112, z: 12 },
  S3: { name: 'Stream Stop', sign: 'STREAM', x: 200, z: -20 },
  S4: { name: 'Canopy Stop', sign: 'CANOPY', x: 129.9, z: 14 }
};
const BUS_LEG_PTS = [
  [[18, -6], [30, -4], [50, 2], [75, 8], [95, 12], [112, 12]],
  [[112, 12], [130, 8], [155, 2], [178, -8], [192, -16], [200, -20]],
  [[200, -20], [178, -16], [150, -9], [120, -6], [90, -4], [60, -2], [35, -4], [18, -6]]
];
const LEG_CURVES = BUS_LEG_PTS.map(pts => new T.CatmullRomCurve3(pts.map(p => new T.Vector3(p[0], 0, p[1])), false, 'catmullrom', 0.5));
const LEG_SAMPLES = LEG_CURVES.map(curve => {
  const N = 150, out = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N;
    const pt = curve.getPoint(u);
    out.push({ x: pt.x, z: pt.z, y: terrainNightBase(pt.x, pt.z) });
  }
  const W = 10, ys = out.map(s => s.y);
  for (let i = 0; i <= N; i++) {
    let acc = 0, n = 0;
    for (let k = -W; k <= W; k++) { const j = clamp(i + k, 0, N); acc += ys[j]; n++; }
    out[i].y = acc / n;
  }
  return out;
});
function busRoadNearest(x, z) {
  let best = 1e18, by = 0;
  for (let L = 0; L < LEG_SAMPLES.length; L++) {
    const samples = LEG_SAMPLES[L];
    for (let i = 0; i < samples.length; i++) {
      const s = samples[i];
      if (s.canopy) continue; // never flatten the terrain toward the canopy road
      const d = (x - s.x) * (x - s.x) + (z - s.z) * (z - s.z);
      if (d < best) { best = d; by = s.y; }
    }
  }
  return { dist: Math.sqrt(best), y: by };
}
function terrainNightHeight(x, z) {
  let h = terrainNightBase(x, z);
  const rd = busRoadNearest(x, z);
  if (rd.dist < 7) h = lerp(h, rd.y, 1 - sstep(2.5, 7, rd.dist));
  return h;
}

(function makeNightTerrain() {
  let g = new T.PlaneGeometry(260, 160, 168, 104);

  const pos = g.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const c = new T.Color();
  for (let f = 0; f < pos.count; f += 3) {
    const cx = (pos.getX(f) + pos.getX(f + 1) + pos.getX(f + 2)) / 3;
    const cy = (pos.getY(f) + pos.getY(f + 1) + pos.getY(f + 2)) / 3;
    const cz = (pos.getZ(f) + pos.getZ(f + 1) + pos.getZ(f + 2)) / 3;
    faceColorNight(cx, cy, cz, c);
    for (let k = 0; k < 3; k++) {
      colors[(f + k) * 3] = c.r; colors[(f + k) * 3 + 1] = c.g; colors[(f + k) * 3 + 2] = c.b;
    }
  }
  g.setAttribute('color', new T.BufferAttribute(colors, 3));

function faceColorNight(x, y, z, out) {
  let r = 0.10, g = 0.165, b = 0.13;                        // deep blue-green shadow
  const n = hash2(x * 0.37, z * 0.53);
  const v = 0.82 + 0.36 * n;
  const m = hash2(x * 0.085, z * 0.078);
  if (m > 0.6) {                                            // moss patches
    const t = sstep(0.6, 0.8, m);
    r = lerp(r, 0.16, t); g = lerp(g, 0.27, t); b = lerp(b, 0.19, t);
  }
  const pd = nightPathDist(x, z);
  if (pd < 2.4) {                                           // moonlit footpath
    const t = (1 - sstep(1.2, 2.4, pd)) * 0.85;
    r = lerp(r, 0.27, t); g = lerp(g, 0.30, t); b = lerp(b, 0.25, t);
  }
  const dg = Math.hypot(x - 120, z - 20);
  if (dg < 14) {                                            // moonlit glade
    const t = (1 - sstep(9, 14, dg)) * 0.7;
    r = lerp(r, 0.17, t); g = lerp(g, 0.27, t); b = lerp(b, 0.18, t);
  }
  const dh = Math.hypot(x - 9, z);
  if (dh < 9) {                                             // dark around the hollow
    const t = (1 - sstep(4, 9, dh)) * 0.6;
    r = lerp(r, 0.06, t); g = lerp(g, 0.09, t); b = lerp(b, 0.09, t);
  }
  const sx2 = sstep(138, 150, x);
  if (sx2 > 0) {                                            // moonlit stream banks and bed
    const az2 = Math.abs(z + 30);
    if (az2 < 5.4) {
      if (y < 0.34) { const t = sx2; r = lerp(r, 0.09, t); g = lerp(g, 0.12, t); b = lerp(b, 0.15, t); }
      else { const t = sx2 * (1 - sstep(4.2, 5.4, az2)); r = lerp(r, 0.19, t); g = lerp(g, 0.22, t); b = lerp(b, 0.23, t); }
    }
  }
  out.setRGB(clamp(r * v, 0, 1), clamp(g * v, 0, 1), clamp(b * v, 0, 1));
}

(function buildStops() {
  const wood = new T.MeshLambertMaterial({ color: 0x6e5638, flatShading: true });

  for (const key of ['S1', 'S2', 'S3']) {
    const s = BUS_STOPS[key];
    const gy = terrainNightHeight(s.x, s.z);
    // post stands on the door side (bus left = local -x), 3 units from the stop point
    const pts = BUS_LEG_PTS[OUT_LEG[key]];
    const yawRef = Math.atan2(pts[1][0] - pts[0][0], pts[1][1] - pts[0][1]);
    const px = s.x - Math.cos(yawRef) * 3.0;
    const pz = s.z + Math.sin(yawRef) * 3.0;
    const post = new T.Mesh(new T.CylinderGeometry(0.09, 0.11, 2.4, 6), wood);
    post.position.set(px, gy + 1.2, pz);
    post.castShadow = true;
    sceneNight.add(post);
    // round sign board naming the stop, readable from 8 units
    const cnv = document.createElement('canvas');
    cnv.width = 256; cnv.height = 256;
    const cx2 = cnv.getContext('2d');
    cx2.fillStyle = '#f5eeda';
    cx2.beginPath(); cx2.arc(128, 128, 124, 0, Math.PI * 2); cx2.fill();
    cx2.strokeStyle = '#8a5a34'; cx2.lineWidth = 12;
    cx2.beginPath(); cx2.arc(128, 128, 117, 0, Math.PI * 2); cx2.stroke();
    cx2.fillStyle = '#4a3826';
    cx2.textAlign = 'center';
    cx2.font = 'bold 40px Georgia';
    cx2.fillText(key, 128, 74);
    cx2.font = 'bold ' + (s.sign.length > 6 ? 30 : 42) + 'px Georgia';
    cx2.fillText(s.sign, 128, 158);
    const tex = new T.CanvasTexture(cnv);
    const sign = new T.Mesh(new T.CircleGeometry(0.72, 20), new T.MeshBasicMaterial({ map: tex }));
    sign.position.set(px, gy + 2.2, pz);
    sign.lookAt(s.x, gy + 2.2, s.z);
    sceneNight.add(sign);
    const back = new T.Mesh(new T.CircleGeometry(0.72, 20), new T.MeshLambertMaterial({ color: 0x8a5a34, flatShading: true }));
    back.position.set(px, gy + 2.2, pz);
    back.lookAt(2 * px - s.x, gy + 2.2, 2 * pz - s.z);
    back.translateZ(-0.03);
    sceneNight.add(back);
    REALM_COLLIDERS.night.circles.push({ x: px, z: pz, r: 0.3 });
  }
})();

/* ---- timetable: pure function of elapsed time, loop period 46 s ---- */
const BUS_LOOP = 63;
const BUS_LOOP_FOUR = 84;
const DWELL_SECONDS = 6;
let busT0 = 0; // timetable origin; R restarts the loop from c = 0
let busPhase = 'dwell1', busAtStop = 'S1', busC = 0, busTarget = BUS_STOPS.S2.name, busDoorT = 1;
const busPush = [];
function legYaw(leg, u) {
  const tan = LEG_CURVES[leg].getTangent(u).normalize();
  return Math.atan2(tan.x, tan.z);
}
function blendAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}
function legPose(leg, u, travelFrac) {
  const curve = LEG_CURVES[leg], samples = LEG_SAMPLES[leg];
  const pos = curve.getPoint(u);
  const tan = curve.getTangent(u).normalize();
  const tanB = curve.getTangent(clamp(u + 0.004, 0, 1)).normalize();
  const tanA = curve.getTangent(clamp(u - 0.004, 0, 1)).normalize();
  const yaw = Math.atan2(tan.x, tan.z);
  let dYaw = Math.atan2(tanB.x, tanB.z) - Math.atan2(tanA.x, tanA.z);
  while (dYaw > Math.PI) dYaw -= Math.PI * 2;
  while (dYaw < -Math.PI) dYaw += Math.PI * 2;
  const bank = clamp(dYaw * 22, -0.069, 0.069) * Math.sin(Math.PI * clamp(travelFrac, 0, 1));
  const fi = u * (samples.length - 1);
  const i0 = Math.floor(fi), i1 = Math.min(samples.length - 1, i0 + 1);
  const gy = lerp(samples[i0].y, samples[i1].y, fi - i0);
  const dy = samples[i1].y - samples[i0].y;
  const ds = curve.getLength() / samples.length;
  const pitch = -Math.atan2(dy, ds);
  return { x: pos.x, z: pos.z, y: gy, yaw, pitch, bank };
}
function busStateAt(c, mode) {
  const four = mode === 'four';
  let phase, leg, u, atStop = null, target, dwellT = -1, inLeg = 0, outLeg = 0;
  if (!four) {
    if (c < 6) { phase = 'dwell1'; leg = 0; u = 0; atStop = 'S1'; target = BUS_STOPS.S2.name; dwellT = c; inLeg = 2; outLeg = 0; }
    else if (c < 21) { phase = 'travel1'; leg = 0; u = easeC(clamp((c - 6) / 15, 0, 1)); target = BUS_STOPS.S2.name; }
    else if (c < 27) { phase = 'dwell2'; leg = 0; u = 1; atStop = 'S2'; target = BUS_STOPS.S3.name; dwellT = c - 21; inLeg = 0; outLeg = 1; }
    else if (c < 42) { phase = 'travel2'; leg = 1; u = easeC(clamp((c - 27) / 15, 0, 1)); target = BUS_STOPS.S3.name; }
    else if (c < 48) { phase = 'dwell3'; leg = 1; u = 1; atStop = 'S3'; target = BUS_STOPS.S1.name; dwellT = c - 42; inLeg = 1; outLeg = 2; }
    else { phase = 'travel3'; leg = 2; u = easeC(clamp((c - 48) / 15, 0, 1)); target = BUS_STOPS.S1.name; }
  } else {
    if (c < 6) { phase = 'dwell1'; leg = 0; u = 0; atStop = 'S1'; target = BUS_STOPS.S2.name; dwellT = c; inLeg = 4; outLeg = 0; }
    else if (c < 21) { phase = 'travel1'; leg = 0; u = easeC(clamp((c - 6) / 15, 0, 1)); target = BUS_STOPS.S2.name; }
    else if (c < 27) { phase = 'dwell2'; leg = 0; u = 1; atStop = 'S2'; target = BUS_STOPS.S3.name; dwellT = c - 21; inLeg = 0; outLeg = 1; }
    else if (c < 42) { phase = 'travel2'; leg = 1; u = easeC(clamp((c - 27) / 15, 0, 1)); target = BUS_STOPS.S3.name; }
    else if (c < 48) { phase = 'dwell3'; leg = 1; u = 1; atStop = 'S3'; target = BUS_STOPS.S4.name; dwellT = c - 42; inLeg = 1; outLeg = 3; }
    else if (c < 63) { phase = 'travel3'; leg = 3; u = easeC(clamp((c - 48) / 15, 0, 1)); target = BUS_STOPS.S4.name; }
    else if (c < 69) { phase = 'dwell4'; leg = 3; u = 1; atStop = 'S4'; target = BUS_STOPS.S1.name; dwellT = c - 63; inLeg = 3; outLeg = 4; }
    else { phase = 'travel4'; leg = 4; u = easeC(clamp((c - 69) / 15, 0, 1)); target = BUS_STOPS.S1.name; }
  }
  const traveling = phase.indexOf('travel') === 0;
  const legStart = phase === 'travel1' ? 6 : phase === 'travel2' ? 27 : phase === 'travel3' ? 48 : 69;
  const travelFrac = traveling ? (c - legStart) / 15 : 0;
  const pose = legPose(leg, u, travelFrac);
  let yaw = pose.yaw, pitch = pose.pitch, bank = pose.bank;
  if (dwellT >= 0) {
    // the bus turns around during each dwell, smoothly re-aiming its door
    const turn = easeC(clamp(dwellT / 5, 0, 1));
    yaw = blendAngle(legYaw(inLeg, 1), legYaw(outLeg, 0), turn);
    pitch = 0; bank = 0;
  }
  const sway = traveling ? 1 : 0.22;
  const yBob = 0.045 * Math.sin(t * 2.2) * sway + 0.01 * Math.sin(t * 1.7);
  const roll = bank + 0.016 * Math.sin(t * 1.9 + 0.8) * sway;
  const pitchS = pitch + 0.011 * Math.sin(t * 1.5 + 2.0) * sway;
  let doorT = 0;
  if (phase === 'dwell1') doorT = Math.min(sstep(0, 0.8, c), 1 - sstep(5.2, 6, c));
  if (phase === 'dwell2') doorT = Math.min(sstep(0, 0.8, c - 21), 1 - sstep(5.2, 6, c - 21));
  if (phase === 'dwell3') doorT = Math.min(sstep(0, 0.8, c - 42), 1 - sstep(5.2, 6, c - 42));
  if (phase === 'dwell4') doorT = Math.min(sstep(0, 0.8, c - 63), 1 - sstep(5.2, 6, c - 63));
  return { c, phase, u, atStop, target, x: pose.x, z: pose.z, y: pose.y, yaw, pitch: pitchS, roll, yBob, doorT, traveling, beamBlend: 1 - doorT };
}
function updateBus() {
  if (switchAt && !loopSwitched && t >= switchAt.t) {
    loopSwitched = true;
    loopMode = 'four';
    busT0 = switchAt.t - switchAt.depC;
  }
  const period = loopMode === 'four' ? BUS_LOOP_FOUR : BUS_LOOP;
  const c = ((((t - busT0) % period) + period) % period);
  const bs = busStateAt(c, loopMode);
  busPhase = bs.phase; busAtStop = bs.atStop; busC = bs.c; busTarget = bs.target; busDoorT = bs.doorT;
  bus.position.set(bs.x, bs.y + bs.yBob, bs.z);
  bus.rotation.y = bs.yaw;
  bus.rotation.x = bs.pitch;
  bus.rotation.z = bs.roll;
  if (busDoorPanel) busDoorPanel.position.z = lerp(0.8, -0.62, bs.doorT);
  if (window.__busTail) window.__busTail.rotation.y = 0.12 * Math.sin(t * 1.1);
  if (boardName !== bs.target) drawBoard(bs.target);
  if (beamLight) {
    beamLight.intensity = 40 + 260 * bs.beamBlend;
    beamCone.material.opacity = 0.04 + 0.09 * bs.beamBlend;
  }
  bus.updateMatrixWorld(true);
  busPush.length = 0;
  const c1 = bus.localToWorld(_tv1.set(0, 0, -0.5));
  busPush.push({ x: c1.x, z: c1.z, r: 2.5 });
  const c2 = bus.localToWorld(_tv2.set(0, 0, 5.0));
  busPush.push({ x: c2.x, z: c2.z, r: 2.1 });
}
function busDoorWorld() {
  return bus.localToWorld(_tv3.set(-2.3, 1.2, 0.8));
}

/* ============================================================
   THE GROWING CEREMONY — acorns, mound, dance, canopy road

const MOUND_REACH = 2;

function canPlant() {
  return acornState.count >= 3 && totoroMet && !ceremony.done && !ceremony.active;
}
function nearestAcorn() {
  if (realm !== 'day' || P.aboard) return null;
  for (const a of acorns) {
    if (a.picked) continue;
    if (Math.hypot(P.x - a.x, P.z - a.z) < 1.5) return a;
  }
  return null;
}
function pickAcorn(a) {
  a.picked = true;
  a.group.visible = false;
  acornState.count++;
}
function addNightCircle(x, z, r) {
  const c = { x, z, r, cer: true };
  REALM_COLLIDERS.night.circles.push(c);
  ceremonyRefs.added.push(c);
  return c;
}
function addNightSeg(ax, az, bx, bz, r) {
  const s = { ax, az, bx, bz, r, cer: true };
  REALM_COLLIDERS.night.segs.push(s);
  ceremonyRefs.added.push(s);
  return s;
}

function startCeremony() {
  if (!canPlant()) return;
  ceremony.active = true;
  ceremony.t = 0;
  runLog.push({ event: 'planted', time: t - runStart });
  buildCeremonyTree();
}
function wondersSeen() {
  return (totoroMet ? 1 : 0) + (treeGrown ? 1 : 0) + (stopsVisited.s1 && stopsVisited.s2 && stopsVisited.s3 && stopsVisited.s4 ? 1 : 0);
}
function wondersComplete() {
  return totoroMet && treeGrown && stopsVisited.s1 && stopsVisited.s2 && stopsVisited.s3 && stopsVisited.s4;
}
function benchSit() {

function fmtMMSS(sec) {
  sec = Math.max(0, sec);
  return Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
}
function cardLabel(e) {
  if (e.event === 'met') return 'You met the great forest spirit';
  if (e.event === 'planted') return 'You planted the acorn';
  const s = BUS_STOPS[e.event.toUpperCase()];

function showCard() {
  const list = document.getElementById('card-list');
  list.innerHTML = runLog.map(e => '<li>' + cardLabel(e) + '<span class="time">' + fmtMMSS(e.time) + '</span></li>').join('');
  document.getElementById('card').style.display = 'flex';
}
let skyLastK = -1;
function applySky(k) {
  if (k === skyLastK) return;
  skyLastK = k;
  const R = nightSkyRefs;
  R.fog.color.copy(R.fogNight).lerp(R.fogDawn, k);
  R.hemiN.color.copy(R.hemiNight.sky).lerp(R.hemiDawn.sky, k);
  R.hemiN.groundColor.copy(R.hemiNight.ground).lerp(R.hemiDawn.ground, k);
  R.hemiN.intensity = lerp(R.hemiNight.int, R.hemiDawn.int, k);
  R.moonL.color.copy(R.moonNight.col).lerp(R.moonDawn.col, k);
  R.moonL.intensity = lerp(R.moonNight.int, R.moonDawn.int, k);
  R.starMat.opacity = 0.85 * (1 - k);
  R.moonMat.opacity = 1 - k;
  R.haloMat.opacity = 0.28 * (1 - k);
  const dome = R.dome.geometry.attributes.color;
  const base = R.domeBase, dawnC = R.domeDawn;
  for (let i = 0; i < dome.count; i++) {
    dome.setXYZ(i, base[i * 3] + (dawnC[i * 3] - base[i * 3]) * k, base[i * 3 + 1] + (dawnC[i * 3 + 1] - base[i * 3 + 1]) * k, base[i * 3 + 2] + (dawnC[i * 3 + 2] - base[i * 3 + 2]) * k);
  }
  dome.needsUpdate = true;
}
function updateDawn(dt) {
  if (!dawn.active) return;
  dawn.t = Math.min(3, dawn.t + dt);
  applySky(clamp(dawn.t / 3, 0, 1));
  if (dawn.t >= 3) {
    dawn.active = false;
    dawn.done = true;
    showCard();
  }
}

}

function updateTreeGrowth(ct) {
  const sprout = treeRefs.sprout, sapling = treeRefs.sapling, giant = treeRefs.giant;
  if (!sprout) return;
  const sp = sstep(0, 4, ct) * (1 - sstep(4.5, 5.5, ct));
  sprout.scale.setScalar(Math.max(0.001, sp));
  sprout.visible = ct < 5.5;
  const sg = sstep(4, 8, ct);
  sapling.scale.set(1 + 0.5 * sstep(4, 10, ct), Math.max(0.001, sg), 1 + 0.5 * sstep(4, 10, ct));
  sapling.visible = ct >= 4 && ct < 10.5;
  const gg = sstep(10, 16.5, ct);
  const thick = 0.4 + 0.6 * sstep(10, 13.5, ct);
  giant.scale.set(thick, Math.max(0.001, gg), thick);
  giant.visible = ct >= 10;
}

function updateCeremony(dt) {
  if (!ceremony.active) return;
  ceremony.t = Math.min(20, ceremony.t + dt);
  const ct = ceremony.t;
  updateTreeGrowth(ct);
  const root = totoroRefs.root;
  const home = totoroRefs.home;
  const DANCE_A0 = Math.atan2(home.z - 14, home.x - 126);
  const DR = 3.0;
  const dx0 = 126 + Math.cos(DANCE_A0) * DR, dz0 = 14 + Math.sin(DANCE_A0) * DR;
  let px, py, pz;
  if (ct < 1.5) {
    const k = easeC(ct / 1.5);
    px = lerp(home.x, dx0, k);
    pz = lerp(home.z, dz0, k);
    py = home.y + 0.5 * k + Math.abs(Math.sin(ct * 6)) * 0.35;
  } else if (ct < 18) {
    const u = (ct - 1.5) / 16.5;
    const ang = DANCE_A0 + u * Math.PI * 2;
    px = 126 + Math.cos(ang) * DR;
    pz = 14 + Math.sin(ang) * DR;
    py = home.y + 0.5 + Math.abs(Math.sin(ct * 3.1)) * 0.35;
    root.rotation.y = Math.atan2(-Math.sin(ang), Math.cos(ang));
  } else if (ct < 19.5) {
    const k = easeC((ct - 18) / 1.5);
    px = lerp(dx0, home.x, k);
    pz = lerp(dz0, home.z, k);
    py = home.y + 0.5 * (1 - k) + Math.abs(Math.sin(ct * 5)) * 0.3 + (ct > 18.9 && ct < 19.35 ? 0.35 : 0);
  } else {
    px = home.x; pz = home.z; py = home.y;
  }
  root.position.set(px, py, pz);
  if (ct >= 19.5) root.rotation.y = -2.29;
  if (totoroRefs.footL) {
    const paddle = ceremony.active && ct > 1.5 && ct < 19.5 ? Math.sin(ct * 6.2) * 0.5 : 0;
    totoroRefs.footL.rotation.x = paddle;
    totoroRefs.footR.rotation.x = -paddle;
  }
  if (ct >= 20) finishCeremony();
}

function finishCeremony() {
  ceremony.done = true;
  ceremony.active = false;
  ceremony.t = 20;
  treeGrown = true;
  buildCanopyWalkway();
  buildS4Stop();
  extendCanopyLegs();
  if (gladePost) {
    const slat = makeSlatMesh('CANOPY', MOUND_POS.x, MOUND_POS.z, 137, 14.5, 1.04);
    gladePost.group.add(slat);
    gladePost.slatMeshes.push({ name: 'CANOPY', mesh: slat });
  }
  // swap the mound collider for the new trunk
  if (ceremonyRefs.moundCircle) {
    const idx = REALM_COLLIDERS.night.circles.indexOf(ceremonyRefs.moundCircle);
    if (idx >= 0) REALM_COLLIDERS.night.circles.splice(idx, 1);
  }
  addNightCircle(MOUND_POS.x, MOUND_POS.z, 1.7);
  // the loop extends from the next departure
  const cNow = (((t - busT0) % BUS_LOOP) + BUS_LOOP) % BUS_LOOP;
  let depC = [6, 21, 42].find(d => d > cNow);
  let depC4;
  if (depC === undefined) { depC = 69; depC4 = 6; } else { depC4 = depC; }
  switchAt = { t: t + (depC - cNow), depC: depC4 };
}

function buildCanopyWalkway() {
  const g = new T.Group();
  sceneNight.add(g);
  ceremonyRefs.walkway = g;
  const CX = MOUND_POS.x, CZ = MOUND_POS.z, R = 3.9, H0 = 0.55, H1 = 18.3;
  const woodMats = [0x9a7a52, 0x8a6a48].map(c => new T.MeshLambertMaterial({ color: c, flatShading: true }));
  const beamMat = new T.MeshLambertMaterial({ color: 0x6e5638, flatShading: true });
  const N = 60, TURNS = 2.5;
  const helix = s => {
    const th = -Math.PI - TURNS * 2 * Math.PI * s;
    return { th, x: CX + R * Math.cos(th), z: CZ + R * Math.sin(th), y: H0 + (H1 - H0) * s };
  };
  const plankGeo = new T.BoxGeometry(4.2, 0.12, 2.35);
  const tilt = -Math.atan2(H1 - H0, 2 * Math.PI * TURNS * R);
  const plankGroups = [[], []];
  const beamGeos = [];
  for (let i = 0; i < N; i++) {
    const a = helix(i / N), b2 = helix((i + 1) / N);
    const geo = plankGeo.clone();
    const m = new T.Matrix4().makeRotationFromEuler(new T.Euler(tilt, Math.PI - a.th, 0, 'YXZ'));
    m.setPosition((a.x + b2.x) / 2, (a.y + b2.y) / 2 + 0.06, (a.z + b2.z) / 2);
    geo.applyMatrix4(m);
    plankGroups[i % 2].push(geo);
    if (i % 6 === 0) {
      const rt = 1.5 - 0.6 * (a.y / 18);
      const len = 1.9 - rt + 0.3;
      const bg = new T.BoxGeometry(len, 0.14, 0.14);
      const bm = new T.Matrix4().makeRotationFromEuler(new T.Euler(0, -a.th, 0));
      bm.setPosition(CX + Math.cos(a.th) * (rt + len / 2 - 0.15), a.y + 0.02, CZ + Math.sin(a.th) * (rt + len / 2 - 0.15));
      bg.applyMatrix4(bm);
      beamGeos.push(bg);
    }
  }
  for (let k = 0; k < 2; k++) {
    const mesh = new T.Mesh(mergeGeoms(plankGroups[k]), woodMats[k]);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    g.add(mesh);
  }
  const beams = new T.Mesh(mergeGeoms(beamGeos), beamMat);
  g.add(beams);
  // rail colliders along both edges (skipping the ground-level entry)
  for (let i = 2; i < N; i++) {
    const a = helix(i / N), b2 = helix((i + 1) / N);
    addNightSeg(CX + 1.95 * Math.cos(a.th), CZ + 1.95 * Math.sin(a.th), CX + 1.95 * Math.cos(b2.th), CZ + 1.95 * Math.sin(b2.th), 0.28);
    addNightSeg(CX + 5.85 * Math.cos(a.th), CZ + 5.85 * Math.sin(a.th), CX + 5.85 * Math.cos(b2.th), CZ + 5.85 * Math.sin(b2.th), 0.28);
  }
  // platform rim
  for (let i = 0; i < 16; i++) {
    const a0 = i / 16 * Math.PI * 2, a1 = (i + 1) / 16 * Math.PI * 2;
    addNightSeg(126 + 8.55 * Math.cos(a0), 14 + 8.55 * Math.sin(a0), 126 + 8.55 * Math.cos(a1), 14 + 8.55 * Math.sin(a1), 0.3);
  }
  // the platform itself
  const plat = new T.Mesh(new T.CylinderGeometry(9, 9, 0.3, 24), new T.MeshLambertMaterial({ color: 0x9a7a52, flatShading: true }));
  plat.position.set(126, 18.15, 14);
  plat.receiveShadow = true;
  plat.castShadow = true;
  g.add(plat);
}

function extendCanopyLegs() {
  const mk = (pts, canopy) => {
    const curve = new T.CatmullRomCurve3(pts.map(p => new T.Vector3(p[0], p[2] || 0, p[1])), false, 'catmullrom', 0.5);
    const N = 150, out = [];
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const pt = curve.getPoint(u);
      out.push({ x: pt.x, z: pt.z, y: canopy ? pt.y : terrainNightBase(pt.x, pt.z), canopy: canopy && pt.y > 1.0 });
    }
    return { curve, samples: out };
  };
  const climb = [[200, -20], [186, -13], [170, -5], [155, 1], [142, 6], [131, 10.5], [123, 13], [120, 14]];
  for (let k = 1; k <= 60; k++) {
    const s = k / 60, th = -Math.PI - 2.5 * 2 * Math.PI * s;
    climb.push([126 + 3.9 * Math.cos(th), 14 + 3.9 * Math.sin(th), 0.55 + 17.75 * s]);
  }
  const desc = [[129.9, 14, 18.3]];
  for (let k = 1; k <= 60; k++) {
    const s = k / 60, th = 2.5 * 2 * Math.PI * s;
    desc.push([126 + 3.9 * Math.cos(th), 14 + 3.9 * Math.sin(th), 18.3 - 17.75 * s]);
  }
  desc.push([122.1, 14], [114, 10.5], [100, 7], [75, 8], [50, 2], [30, -4], [18, -6]);
  const l3 = mk(climb, true), l4 = mk(desc, true);
  LEG_CURVES.push(l3.curve, l4.curve);
  LEG_SAMPLES.push(l3.samples, l4.samples);
}

/* zone */
function zoneDay(x, z) {
  if (x >= 152) return 'Forest Edge';
  const az = Math.abs(z - 40);
  if (az < 11) return 'Riverside';
  if (x >= 56 && x <= 114 && z >= -44 && z <= 32) return 'Paddy Fields';
  if (x >= 44 && az < 20) return 'Riverside';
  return 'Old House';
}
function zoneNight(x, z) {
  if (Math.hypot(x - 120, z - 20) < 16) return "Totoro's Glade";
  if (Math.hypot(x - 9.4, z) < 14) return 'Hollow of Night';
  return 'Moonlit Forest';
}
function zoneAt(x, z) {
  return realm === 'day' ? zoneDay(x, z) : zoneNight(x, z);
}

/* ---------------- input ---------------- */
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter' && !e.repeat) {
    if (!started) {
      started = true;
      runStart = t;
      overlay.classList.add('hidden');
    }
    return;
  }
  if (e.code === 'KeyR' && !e.repeat) { resetGame(); return; }
  if (e.code === 'KeyE' && !e.repeat && started && !stepState.active) handleInteract();
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));

function handleInteract() {
  if (P.aboard) {
    if (P.sitting) { standUp(); return; }
    const seat = nearestSeatLocal();
    if (seat) { sitDown(seat); return; }
    if (busAtStop && busDoorT > 0.5 && Math.hypot(P.lx + 1.9, P.lz - 0.8) < 1.6) startAlight();
    return;
  }
  if (realm === 'night') {
    if (P.benchSitting) { standFromBench(); return; }
    if (treeGrown && Math.hypot(P.x - BENCH.x, P.z - BENCH.z) < 2) { benchSit(); return; }
    if (!ceremony.done && !ceremony.active && canPlant() && Math.hypot(P.x - MOUND_POS.x, P.z - MOUND_POS.z) < MOUND_REACH) { startCeremony(); return; }
    if (busAtStop && busDoorT > 0.5) {
      const dw = busDoorWorld();
      if (Math.hypot(P.x - dw.x, P.z - dw.z) < 2) { startBoard(); return; }
    }
    return;
  }
  const ac = nearestAcorn();
  if (ac) { pickAcorn(ac); return; }
  tryDoor();
}
function nearestSeatLocal() {
  let best = null, bd = 1.25;
  for (const s of busSeats) {
    const d = Math.hypot(P.lx - s.x, P.lz - s.z);
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}
function sitDown(seat) {
  P.sitting = true;
  P.lx = seat.x * 0.97; P.lz = seat.z; P.ly = 1.35;
  P.sitSeat = seat;
  walkPhase = 0;
}
function standUp() {
  P.sitting = false;
  if (P.sitSeat) { P.lx = P.sitSeat.x * 0.45; P.lz = P.sitSeat.z; }
  P.ly = 1.35;
}
function startBoard() {
  stepState.active = true; stepState.mode = 'board'; stepState.t = 0;
  stepState.fromX = P.x; stepState.fromY = P.y; stepState.fromZ = P.z;
  P.aboard = true;
  P.sitting = false;
  boardStop = busAtStop || null;
  camYaw = bus.rotation.y + Math.PI / 2; // camera on the door side, looking across the cabin
}
function startAlight() {
  stepState.active = true; stepState.mode = 'alight'; stepState.t = 0;
  stepState.fromX = P.x; stepState.fromY = P.y; stepState.fromZ = P.z;
  P.sitting = false;
}
function updateStep(dt) {
  if (!stepState.active) return;
  stepState.t += dt / 1.15;

    else { ax = out.x; ay = bus.position.y; az = out.z; bx = out.x; by = groundHeight(out.x, out.z); bz = out.z; m = (k - 0.7) / 0.3; }

/* ---------------- hollow passage between realms ---------------- */
function setRealm(r) {

}
function startPassage() {

  fadeState.active = true;
  fadeState.t = 0;
  fadeState.target = realm === 'day'
    ? { realm: 'night', x: NIGHT_SPAWN.x, z: NIGHT_SPAWN.z, yaw: Math.PI / 2, camYaw: -Math.PI / 2 }

}
function doTransition(tg) {
  setRealm(tg.realm);
  P.x = tg.x; P.z = tg.z; P.y = groundHeight(P.x, P.z);
  modelYaw = tg.yaw;
  camYaw = tg.camYaw;

}
function updatePassage(dt) {
  if (!fadeState.active) return;
  fadeState.t += dt;
  const OUT = 0.5, TOTAL = 1.2;
  if (fadeState.t < OUT) {
    elFade.style.opacity = String(Math.min(1, fadeState.t / OUT));
  } else {
    if (fadeState.target) { doTransition(fadeState.target); fadeState.target = null; }
    const u = (fadeState.t - OUT) / (TOTAL - OUT);
    elFade.style.opacity = String(Math.max(0, 1 - u));
    if (fadeState.t >= TOTAL) {
      fadeState.active = false;
      elFade.style.opacity = '0';
    }

}

/* ---------------- movement ---------------- */
function canStand(x, z, fx, fz) {
  const bx = realm === 'day' ? 198 : 258;
  const bz = realm === 'day' ? 68 : 78;
  if (x < 2 || x > bx || z < -bz || z > bz) return false;
  const h = groundHeight(x, z);
  const dh = h - groundHeight(fx, fz);
  const dist = Math.hypot(x - fx, z - fz);
  if (dh > SLOPE_LIMIT * dist + 1e-5) return false;
  return true;
}
function resolveColliders() {
  const set = REALM_COLLIDERS[realm];
  for (const c of set.circles) {
    const dx = P.x - c.x, dz = P.z - c.z;
    const d = Math.hypot(dx, dz), min = c.r + PLAYER_R;
    if (d < min && d > 1e-6) {
      P.x = c.x + dx / d * min;
      P.z = c.z + dz / d * min;
    }
  }
  for (const s of set.segs) {
    if (s.door && doorState.frac > 0.5) continue;
    const cp = segClosest(P.x, P.z, s);
    const dx = P.x - cp.x, dz = P.z - cp.z;
    const d = Math.hypot(dx, dz), min = s.r + PLAYER_R;
    if (d < min && d > 1e-6) {
      P.x = cp.x + dx / d * min;
      P.z = cp.z + dz / d * min;
    }

}
function updatePlayer(dt) {
  let ix = 0, iz = 0;
  if (started && !stepState.active && !(P.aboard && P.sitting) && !P.benchSitting) {
    ix = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
    iz = (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0) - (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0);
  }
  let moving = false;
  if (stepState.active) {
    updateStep(dt);
    moving = true;
  } else if (P.benchSitting) {
    // seated on the dawn bench, high above the forest
    P.x = BENCH.x - 0.12; P.y = BENCH.top - 0.33; P.z = BENCH.z;
    if (!dawn.active && !dawn.done && wondersComplete()) {
      dawn.active = true;
      dawn.t = 0;
    }
  } else if (P.aboard) {
    // local movement inside the moving cabin
    if (ix !== 0 || iz !== 0) {
      const busYaw = bus.rotation.y;
      const cyL = camYaw - busYaw;
      const fs = -Math.sin(cyL), fc = -Math.cos(cyL);
      const rs = Math.cos(cyL), rc = -Math.sin(cyL);
      let mx = fs * (-iz) + rs * ix;
      let mz = fc * (-iz) + rc * ix;
      const L = Math.hypot(mx, mz) || 1;
      mx /= L; mz /= L;
      P.lx = clamp(P.lx + mx * 4.0 * dt, -1.35, 1.35);
      P.lz = clamp(P.lz + mz * 4.0 * dt, -4.0, 3.0);
      if (Math.abs(P.lz - 0.8) < 0.7) P.lx = Math.max(P.lx, -1.55); // doorway threshold: exit via E only
      for (const s of busSeats) {
        const ddx = P.lx - s.x, ddz = P.lz - s.z;
        const dd = Math.hypot(ddx, ddz);
        if (dd < 0.95 && dd > 1e-4) {
          P.lx = clamp(s.x + ddx / dd * 0.95, -1.35, 1.35);
          P.lz = s.z + ddz / dd * 0.95;
        }
      }
      modelYaw = dampA(modelYaw, Math.atan2(mx, mz) + busYaw, 12, dt);
      const wmx = mx * Math.cos(busYaw) + mz * Math.sin(busYaw);
      const wmz = -mx * Math.sin(busYaw) + mz * Math.cos(busYaw);
      camYaw = dampA(camYaw, Math.atan2(wmx, wmz) + Math.PI, 2.5, dt);
      moving = true;
    }
    if (P.sitting) {
      const wp = bus.localToWorld(_tv1.set(P.lx, 1.5, P.lz));
      P.x = wp.x; P.y = wp.y; P.z = wp.z;
    } else {
      const wp = bus.localToWorld(_tv1.set(P.lx, P.ly, P.lz));
      P.x = wp.x; P.y = wp.y; P.z = wp.z;
    }

    if (ix !== 0 || iz !== 0) {
      const fs = -Math.sin(camYaw), fc = -Math.cos(camYaw);
      const rs = Math.cos(camYaw), rc = -Math.sin(camYaw);
      const mx = fs * (-iz) + rs * ix;
      const mz = fc * (-iz) + rc * ix;
      const L = Math.hypot(mx, mz);
      if (L > 0) {
        const nx = P.x + mx / L * 4.0 * dt;
        if (canStand(nx, P.z, P.x, P.z)) P.x = nx;
        const nz = P.z + mz / L * 4.0 * dt;
        if (canStand(P.x, nz, P.x, P.z)) P.z = nz;
      }
      resolveColliders();
      const targetYaw = Math.atan2(mx, mz);

      camYaw = dampA(camYaw, Math.atan2(-mx, -mz), 2.5, dt);
      moving = true;
    }
    P.y = groundHeight(P.x, P.z);

    if (realm === 'night') {

        const dd = Math.hypot(ddx, ddz), mn = c.r + PLAYER_R;

          P.z = c.z + ddz / dd * mn;

    // hollow passage: a 2-unit circle at each hollow mouth, armed with hysteresis
    if (started && !fadeState.active) {
      const mouth = realm === 'day' ? DAY_MOUTH : NIGHT_MOUTH;
      const dm = Math.hypot(P.x - mouth.x, P.z - mouth.z);

  if (moving) {
    walkPhase += dt * 10;
    moveBlend = dampN(moveBlend, 1, 8, dt);
  } else {
    moveBlend = dampN(moveBlend, 0, 8, dt);
  }
  model.position.set(P.x, P.y, P.z);
  model.rotation.y = modelYaw;
  // animation
  const mb = moveBlend;
  const swing = Math.sin(walkPhase);
  if (P.sitting) {
    parts.legL.rotation.x = -1.45;
    parts.legR.rotation.x = -1.45;
    parts.armL.rotation.x = -0.55;
    parts.armR.rotation.x = -0.55;

    parts.armR.rotation.x = (swing * 0.55 - 0.05) * mb + 0.04 * Math.sin(t * 1.7 + 1.2) * (1 - mb);

}

/* ---------------- door & well ---------------- */
function applyDoorPanel() {

}
function updateDoor(dt) {

    if (doorState.open) {
      doorState.frac = Math.min(1, doorState.frac + speed);
      if (doorState.frac >= 1) doorState.anim = null;
    } else {

}
function updateWell(dt) {
  const dx = P.x - WELL_POINT.x, dz = P.z - WELL_POINT.z;
  const near = realm === 'day' && dx * dx + dz * dz < 5.3;
  const pumping = started && near && !wellState.filled && keys.has('KeyE');
  if (pumping) {
    wellState.pumpT = Math.min(1, wellState.pumpT + dt);

/* ---------------- frogs ---------------- */
function updateFrogs() {
  for (const f of frogs) {
    if (f.state === 'home') {
      if (started && realm === 'day') {
        const d = Math.hypot(P.x - f.pos.x, P.z - f.pos.z);
        if (d < FROG_FLEE_RADIUS) { f.state = 'hopping'; f.t0 = t; }
      }
      f.body.scale.y = 0.75 + Math.sin(t * 2.4 + f.id * 2.1) * 0.05;
    } else if (f.state === 'hopping') {
      const u = (t - f.t0) / 1.65;
      if (u >= 1) { f.state = 'hidden'; f.t0 = t; f.group.visible = false; }
      else {
        const prog = u * 3;
        const i0 = Math.min(2, Math.floor(prog));
        const s = prog - i0;
        const a = f.path[i0], b = f.path[i0 + 1];
        const x = lerp(a[0], b[0], s), z = lerp(a[1], b[1], s);
        const gy = groundHeight(x, z);
        const y = gy + 0.5 * Math.sin(Math.PI * s) - (i0 === 2 ? 0.12 : 0);
        f.pos = { x, y, z };
        f.group.position.set(x, y, z);
        f.group.rotation.y = Math.atan2(b[0] - a[0], b[1] - a[1]);
        const st = 1 + 0.35 * Math.sin(Math.PI * s);
        f.body.scale.set(1.15 / Math.sqrt(st), 0.75 * st, 1.35 / Math.sqrt(st));
      }
    } else if (f.state === 'hidden') {
      if (t - f.t0 >= 20) { f.state = 'emerging'; f.t0 = t; f.group.visible = true; f.group.position.set(f.home.x, f.home.y, f.home.z); f.pos = { x: f.home.x, y: f.home.y, z: f.home.z }; }
    } else if (f.state === 'emerging') {
      const u = (t - f.t0) / 0.45;
      if (u >= 1) { f.state = 'home'; f.group.position.set(f.home.x, f.home.y, f.home.z); f.pos = { x: f.home.x, y: f.home.y, z: f.home.z }; }
      else {
        const y = f.home.y + 0.3 * Math.sin(Math.PI * u);
        f.group.position.y = y;
        f.pos.y = y;
      }
    }
  }
}

    totoroRefs.body.scale.y = 1.22 * (1 + 0.014 * breath);
    const m = t % 7;
    totoroRefs.earL.rotation.z = 0.13 - (m < 0.4 ? Math.sin(Math.PI * m / 0.4) * 0.5 : 0);
    totoroRefs.tailTip.rotation.y = 0.35 * Math.sin(t * 0.9);
  }
  // first meeting within 3 units
  if (realm === 'night' && started && !totoroMet) {
    const d = Math.hypot(P.x - TOTORO_POS.x, P.z - TOTORO_POS.z);
    if (d < 3) {
      totoroMet = true;
      runLog.push({ event: 'met', time: t - runStart });
      showBanner('The great forest spirit sleeps. Best tiptoe.');
    }
  }
  // forest spirits: visible and swaying when far, ducked when the child is near
  for (const s of spirits) {
    if (realm === 'night') s.hidden = Math.hypot(P.x - s.x, P.z - s.z) < SPIRIT_HIDE_RADIUS;
    s.scale = dampN(s.scale, s.hidden ? 0.02 : 1, 8, dt);
    s.group.scale.setScalar(Math.max(0.02, s.scale));
    s.group.position.y = s.baseY + (s.hidden ? -0.25 : 0.06 * Math.sin(t * 0.9 + s.phase));
    s.group.rotation.z = s.hidden ? 0 : 0.12 * Math.sin(t * 1.3 + s.phase);
  }
}

/* ---------------- camera ---------------- */
const CAM_BLOCKERS = {
  house: { minX: 15.1, maxX: 24.9, minY: 0.4, maxY: 6.6, minZ: -2.6, maxZ: 6.6 },
  bridges: BRIDGE_XS.map(bx => ({ minX: bx - 1.5, maxX: bx + 1.5, minY: 0.7, maxY: 1.5, minZ: 35.2, maxZ: 44.8 })),
  giantTrunk: { x: 185, z: 0, r: 5.0, y1: 14 },
  poles: [{ x: 13, z: 5.5, r: 0.2, y1: 3.0 }, { x: 21, z: 7.5, r: 0.2, y1: 3.0 }, { x: 16, z: -4, r: 1.05, y1: 1.7 }]
};
function segAABB(px, py, pz, dx, dy, dz, b) {
  let t0 = 0, t1 = 1;
  const bounds = [[b.minX, b.maxX, px, dx], [b.minY, b.maxY, py, dy], [b.minZ, b.maxZ, pz, dz]];
  for (const [mn, mx, o, d] of bounds) {
    if (Math.abs(d) < 1e-9) { if (o < mn || o > mx) return -1; }
    else {
      let ta = (mn - o) / d, tb = (mx - o) / d;
      if (ta > tb) { const tmp = ta; ta = tb; tb = tmp; }
      t0 = Math.max(t0, ta); t1 = Math.min(t1, tb);
      if (t0 > t1) return -1;
    }
  }
  return t0;
}
function segCircle(px, py, pz, dx, dy, dz, c) {
  const ox = px - c.x, oz = pz - c.z;
  const a = dx * dx + dz * dz;
  if (a < 1e-9) return -1;
  const bq = 2 * (ox * dx + oz * dz);
  const cq = ox * ox + oz * oz - c.r * c.r;
  const disc = bq * bq - 4 * a * cq;
  if (disc < 0) return -1;
  const tt = (-bq - Math.sqrt(disc)) / (2 * a);
  if (tt < 0 || tt > 1) return -1;
  const y = py + dy * tt;
  if (y < c.y0 - 0.2 || y > c.y1 + 0.2) return -1;
  return tt;
}
function segSphere(px, py, pz, dx, dy, dz, s) {
  const ox = px - s.cx, oy = py - s.cy, oz = pz - s.cz;
  const a = dx * dx + dy * dy + dz * dz;
  if (a < 1e-9) return -1;
  const bq = 2 * (ox * dx + oy * dy + oz * dz);
  const cq = ox * ox + oy * oy + oz * oz - s.r * s.r;
  const disc = bq * bq - 4 * a * cq;
  if (disc < 0) return -1;
  const tt = (-bq - Math.sqrt(disc)) / (2 * a);
  return (tt >= 0 && tt <= 1) ? tt : -1;
}
function insideHouse() {
  return realm === 'day' && P.x > 15.4 && P.x < 24.6 && P.z > -2.1 && P.z < 4.1;
}
function computeCabinCamera() {
  const busYaw = bus.rotation.y;
  if (stepState.active && stepState.mode === 'alight') {
    // trail the child out through the open doorway
    const pos = _tv1.set(P.x - Math.cos(busYaw) * 2.0, P.y + 1.15, P.z + Math.sin(busYaw) * 2.0);
    return { pos, focus: _tv2.set(P.x, P.y + 1.2, P.z) };
  }
  const sit = P.sitting;
  const cyL = camYaw - busYaw;
  const fx = P.lx, fz = P.lz;
  const fy = sit ? 2.1 : P.ly + 1.25;
  const dxl = -Math.sin(cyL), dzl = -Math.cos(cyL);
  let tMax = sit ? 1.9 : 2.5;
  if (Math.abs(dxl) > 1e-4) {
    const t = (dxl > 0 ? (1.1 - fx) : (-1.1 - fx)) / dxl;
    if (t > 0) tMax = Math.min(tMax, t);
  }
  if (Math.abs(dzl) > 1e-4) {
    const t = (dzl > 0 ? (3.1 - fz) : (-4.1 - fz)) / dzl;
    if (t > 0) tMax = Math.min(tMax, t);
  }
  const dist = clamp(tMax - 0.12, 0.4, sit ? 1.9 : 2.5);
  const px = clamp(fx + dxl * dist, -1.62, 1.62);
  const pz = clamp(fz + dzl * dist, -4.3, 3.4);
  const pos = _tv1.set(px, clamp(fy + (sit ? 0.55 : 0.95), 1.85, 3.02), pz);
  return { pos: bus.localToWorld(pos), focus: bus.localToWorld(_tv2.set(fx, fy, fz)) };
}
function computeCamera() {
  const fx = P.x - Math.sin(camYaw) * 1.1, fz = P.z - Math.cos(camYaw) * 1.1;
  const fy = P.y + 1.25;
  const ox = Math.sin(camYaw), oz = Math.cos(camYaw);
  let bestT = 1;
  for (let i = 1; i <= 24; i++) {
    const tt = i / 24;
    const sx = fx + ox * 5.5 * tt, sy = fy + 2.2 * tt, sz = fz + oz * 5.5 * tt;
    if (groundHeight(sx, sz) + 0.42 > sy) { bestT = (i - 1) / 24; break; }
  }
  const px = P.x, py = P.y + 0.8, pz = P.z;
  const dx = fx - px + ox * 5.5, dy = fy - py + 2.2, dz = fz - pz + oz * 5.5;
  if (realm === 'day') {
    const hitHouse = insideHouse() ? -1 : segAABB(px, py, pz, dx, dy, dz, CAM_BLOCKERS.house);
    if (hitHouse >= 0 && hitHouse < bestT) bestT = hitHouse;
    for (const b of CAM_BLOCKERS.bridges) {
      const ht = segAABB(px, py, pz, dx, dy, dz, b);
      if (ht >= 0 && ht < bestT) bestT = ht;
    }
    const gt = segCircle(px, py, pz, dx, dy, dz, { x: 185, z: 0, r: 5.0, y0: 0, y1: 20 });
    if (gt >= 0 && gt < bestT) bestT = gt;
    for (const p2 of CAM_BLOCKERS.poles) {
      const pt = segCircle(px, py, pz, dx, dy, dz, { x: p2.x, z: p2.z, r: p2.r, y0: 0, y1: p2.y1 });
      if (pt >= 0 && pt < bestT) bestT = pt;
    }
    for (const tr of treeList) {
      if (!tr.camBlocks) continue;
      if (Math.abs(tr.x - P.x) > 11 || Math.abs(tr.z - P.z) > 11) continue;
      for (const cb of tr.camBlocks) {
        const ht = cb.r && cb.cy !== undefined
          ? segSphere(px, py, pz, dx, dy, dz, cb)
          : segCircle(px, py, pz, dx, dy, dz, cb);
        if (ht >= 0 && ht < bestT) bestT = ht;
      }
    }
  } else {
    for (const c of NIGHT_CAM.trunks) {
      const ht = segCircle(px, py, pz, dx, dy, dz, c);
      if (ht >= 0 && ht < bestT) bestT = ht;
    }
    for (const s of NIGHT_CAM.spheres) {
      const ht = segSphere(px, py, pz, dx, dy, dz, s);
      if (ht >= 0 && ht < bestT) bestT = ht;
    }
    // the Catbus itself
    const bp = bus.position;
    const bb1 = segSphere(px, py, pz, dx, dy, dz, { cx: bp.x, cy: bp.y + 2.2, cz: bp.z, r: 3.2 });
    if (bb1 >= 0 && bb1 < bestT) bestT = bb1;
    const hp = bus.localToWorld(_tv3.set(0, 2.6, 5.4));
    const bb2 = segSphere(px, py, pz, dx, dy, dz, { cx: hp.x, cy: hp.y, cz: hp.z, r: 2.3 });
    if (bb2 >= 0 && bb2 < bestT) bestT = bb2;
  }
  let dist = clamp(bestT * 5.5 * 0.94, 1.25, 5.5);
  if (insideHouse()) dist = Math.min(dist, 3.0);
  return { fx, fy, fz, ox, oz, dist };
}
function updateCamera(dt) {
  if (!started) camYaw += dt * 0.04;
  if (P.benchSitting) {
    camera.position.set(BENCH.x - 1.0, BENCH.top + 3.3, BENCH.z);
    camera.lookAt(BENCH.x + 5.5, BENCH.top + 1.7, BENCH.z);
    camDistCur = 5.5;
    return;
  }
  if (P.aboard) {
    const c = computeCabinCamera();
    camera.position.copy(c.pos);
    camera.lookAt(c.focus.x, c.focus.y, c.focus.z);
    camDistCur = 5.5;
    return;
  }
  const c = computeCamera();
  if (c.dist < camDistCur - 0.02) camDistCur = c.dist;
  else camDistCur = dampN(camDistCur, c.dist, 5, dt);
  camera.position.set(c.fx + c.ox * camDistCur, c.fy + 2.2 * (camDistCur / 5.5), c.fz + c.oz * camDistCur);
  const minY = groundHeight(camera.position.x, camera.position.z) + 0.45;
  if (camera.position.y < minY) camera.position.y = minY;
  camera.lookAt(c.fx, c.fy, c.fz);
}
function snapCamera() {
  if (P.aboard) {
    const c = computeCabinCamera();
    camera.position.copy(c.pos);
    camera.lookAt(c.focus.x, c.focus.y, c.focus.z);
    camDistCur = 5.5;
    return;
  }
  camDistCur = 5.5;
  const c = computeCamera();
  camDistCur = c.dist;
  camera.position.set(c.fx + c.ox * camDistCur, c.fy + 2.2 * (camDistCur / 5.5), c.fz + c.oz * camDistCur);
  camera.lookAt(c.fx, c.fy, c.fz);
}

/* ---------------- HUD & state export ---------------- */
let lastZoneShown = '';
function updateHUD() {
  const z = zoneAt(P.x, P.z);
  if (z !== lastZoneShown) { lastZoneShown = z; elZone.textContent = z; }
  let prompt = null, prog = -1;
  const dx = P.x - DOOR_POINT.x, dz = P.z - DOOR_POINT.z;
  const nearDoor = dx * dx + dz * dz < 4;
  const fx = Math.sin(modelYaw), fz = Math.cos(modelYaw);
  const dl = Math.hypot(dx, dz) || 1;
  const facing = (fx * (-dx / dl) + fz * (-dz / dl)) > 0.2;
  const nearWell = (P.x - WELL_POINT.x) ** 2 + (P.z - WELL_POINT.z) ** 2 < 5.3;
  if (started && P.aboard) {
    if (stepState.active) prompt = null;
    else if (P.sitting) prompt = 'Press <kbd>E</kbd> to stand up';
    else if (nearestSeatLocal()) prompt = 'Press <kbd>E</kbd> to sit';
    else if (busAtStop && busDoorT > 0.5 && Math.hypot(P.lx + 1.9, P.lz - 0.8) < 1.6) prompt = 'Press <kbd>E</kbd> — Alight';
  } else if (started && P.benchSitting && !dawn.active) {
    if (!wondersComplete()) prompt = 'The dawn is not ready — ' + wondersSeen() + ' of 3 wonders seen.';
  } else if (started && realm === 'night' && treeGrown && !P.benchSitting && !stepState.active &&
             Math.hypot(P.x - BENCH.x, P.z - BENCH.z) < 2) {
    prompt = 'Press <kbd>E</kbd> — Sit';
  } else if (started && realm === 'night' && !ceremony.done && !ceremony.active && !P.aboard && !stepState.active &&
             Math.hypot(P.x - MOUND_POS.x, P.z - MOUND_POS.z) < MOUND_REACH) {
    if (acornState.count < 3) prompt = 'The mound waits for three acorns.';
    else if (!totoroMet) prompt = 'The mound stirs only for a friend of the forest.';
    else prompt = 'Press <kbd>E</kbd> — Plant';
  } else if (started && realm === 'night' && busAtStop && busDoorT > 0.5 && !stepState.active) {
    const dw = busDoorWorld();
    if (Math.hypot(P.x - dw.x, P.z - dw.z) < 2) prompt = 'Press <kbd>E</kbd> — Board';
  } else if (started && realm === 'day' && nearDoor && facing) {
    prompt = doorState.open ? 'Press <kbd>E</kbd> to close the door' : 'Press <kbd>E</kbd> to open the door';
  } else if (started && realm === 'day' && nearWell) {
    if (!wellState.filled) { prompt = 'Hold <kbd>E</kbd> to pump the well'; prog = wellState.pumpT; }
    else prompt = 'The bucket is full.';
  } else if (started && realm === 'day' && !stepState.active) {
    const ac = nearestAcorn();
    if (ac) prompt = 'Press <kbd>E</kbd> — Pick up the acorn';
  }
  if (prompt) {
    elPrompt.style.display = 'block';
    elPromptText.innerHTML = prompt;
    if (prog >= 0) { elPromptTrack.style.display = 'block'; elPromptFill.style.width = (prog * 100).toFixed(1) + '%'; }
    else elPromptTrack.style.display = 'none';
  } else {
    elPrompt.style.display = 'none';
  }
  // live timetable read / riding banner
  let busMsg = '';
  if (started) {
    if (P.aboard) {
      busMsg = 'Aboard the Catbus — next stop: ' + busTarget;
    } else if (realm === 'night') {
      const stops = treeGrown ? ['S1', 'S2', 'S3', 'S4'] : ['S1', 'S2', 'S3'];
      const period = treeGrown ? BUS_LOOP_FOUR : BUS_LOOP;
      for (const key of stops) {
        const s = BUS_STOPS[key];
        if (Math.hypot(P.x - s.x, P.z - s.z) < 6) {
          const dep = key === 'S1' ? 6 : key === 'S2' ? 21 : key === 'S3' ? 42 : 63;
          const N = (busC < dep ? dep : dep + period) - busC;
          busMsg = 'Next departure: ' + Math.max(0, Math.ceil(N)) + 's';
        }
      }
    }
  }
  elBus.textContent = busMsg;
  elBus.style.display = busMsg ? 'block' : 'none';
  elAcorns.textContent = 'Acorns: ' + acornState.count + '/3';
  elAcorns.style.display = started ? 'block' : 'none';
}
function exportState() {
  window.__arena_state = {
    player: { pos: { x: P.x, y: P.y, z: P.z }, zone: zoneAt(P.x, P.z), realm, aboard: !!P.aboard, sitting: !!P.sitting },
    door: { open: doorState.open },
    well: { filled: wellState.filled },
    frogs: frogs.map(f => ({ id: f.id, state: f.state, pos: { x: f.pos.x, y: f.pos.y, z: f.pos.z } })),
    dragonflies: flies.map(d => ({ id: d.id, pos: { x: d.pos.x, y: d.pos.y, z: d.pos.z } })),
    totoro: { met: totoroMet },
    spirits: spirits.map(s => ({ id: s.id, hidden: !!s.hidden })),
    fireflies: FIREFLY_COUNT,
    bus: { phase: busPhase, atStop: busAtStop, t: +busC.toFixed(2), mode: loopMode },
    dwellSeconds: DWELL_SECONDS,
    spiritHideRadius: SPIRIT_HIDE_RADIUS,
    frogFleeRadius: FROG_FLEE_RADIUS,
    trailPresent: TRAIL_PRESENT,
    acorns: { count: acornState.count, picked: acorns.map(a => a.picked) },
    ceremony: { done: ceremony.done, t: +(ceremony.active ? ceremony.t : (ceremony.done ? 20 : 0)).toFixed(2) },
    tree: { grown: treeGrown },
    stopsVisited: { s1: stopsVisited.s1, s2: stopsVisited.s2, s3: stopsVisited.s3, s4: stopsVisited.s4 },
    wonders: { met: totoroMet, grown: treeGrown, rodeAll: stopsVisited.s1 && stopsVisited.s2 && stopsVisited.s3 && stopsVisited.s4 },
    dawn: { done: dawn.done },
    log: runLog.map(e => ({ event: e.event, time: +e.time.toFixed(2) }))
  };
}
/* debugging aid only */
window.__arena_debug = {
  teleport(x, z, yaw, forceY) {
    P.x = clamp(x, 2, realm === 'day' ? 198 : 258); P.z = clamp(z, realm === 'day' ? -68 : -78, realm === 'day' ? 68 : 78);
    if (typeof forceY === 'number') P.y = forceY;
    P.y = groundHeight(P.x, P.z);
    if (typeof yaw === 'number') { camYaw = yaw; modelYaw = yaw + Math.PI; camDistCur = 5.5; }
  },
  groundAt(x, z) { return +groundHeight(x, z).toFixed(2); },
  goto(r, x, z, yaw) {
    setRealm(r);
    this.teleport(x, z, yaw);
  },
  flyPos(i) {
    const m = new T.Matrix4();
    fireflyMesh.getMatrixAt(i, m);
    const v = new T.Vector3().setFromMatrixPosition(m);
    return { x: v.x, y: v.y, z: v.z };
  },
  aboard(lx, lz) {
    if (!P.aboard) return;
    P.lx = clamp(lx, -1.35, 1.35); P.lz = clamp(lz, -4.0, 3.0); P.ly = 1.35;
    P.sitting = false;
  },
  camLocal() {
    const v = bus.worldToLocal(camera.position.clone());
    return { x: +v.x.toFixed(2), y: +v.y.toFixed(2), z: +v.z.toFixed(2) };
  },
  busInfo() {
    return { c: +busC.toFixed(2), phase: busPhase, atStop: busAtStop, doorT: +busDoorT.toFixed(2), x: +bus.position.x.toFixed(2), y: +bus.position.y.toFixed(3), z: +bus.position.z.toFixed(2), yaw: +bus.rotation.y.toFixed(2) };
  },
  busRay(ox, oy, oz, dx, dy, dz) {
    const o = bus.localToWorld(new T.Vector3(ox, oy, oz));
    const d = new T.Vector3(dx, dy, dz).applyQuaternion(bus.quaternion).normalize();
    const rc = new T.Raycaster(o, d, 0, 60);
    const hits = rc.intersectObject(bus, true);
    return hits.slice(0, 4).map(h => {
      const p = h.object.geometry.parameters || {};
      return { dist: +h.distance.toFixed(2), kind: h.object.geometry.type, w: p.width, hgt: p.height, d: p.depth, pos: [+h.point.x.toFixed(2), +h.point.y.toFixed(2), +h.point.z.toFixed(2)] };
    });
  },
  busJump(c) { busT0 = t - c; },
  busDoor() {
    const dw = busDoorWorld();
    return { x: +dw.x.toFixed(2), y: +dw.y.toFixed(2), z: +dw.z.toFixed(2), dist: +Math.hypot(P.x - dw.x, P.z - dw.z).toFixed(2) };
  },
  signposts() {
    const all = [];
    daySignposts.forEach((s, i) => all.push({ realm: 'day', post: i, slats: s.slatMeshes.map(m => m.name) }));
    nightSignposts.forEach((s, i) => all.push({ realm: 'night', post: i, slats: s.slatMeshes.map(m => m.name) }));
    return all;
  },
  busAt(c) {
    const bs = busStateAt(c, loopMode);
    return { c: +bs.c.toFixed(2), phase: bs.phase, atStop: bs.atStop, u: +bs.u.toFixed(3), doorT: +bs.doorT.toFixed(2), x: +bs.x.toFixed(2), z: +bs.z.toFixed(2), yaw: +bs.yaw.toFixed(3), roll: +bs.roll.toFixed(3) };
  },
  project(x, y, z) {
    const v = new T.Vector3(x, y, z).project(camera);
    return { x: v.x, y: v.y, z: v.z };
  },
  samplePatch(px, py, r) {
    renderer.render(realm === 'day' ? scene : sceneNight, camera);
    const gl = renderer.getContext();
    const dpr = renderer.getPixelRatio();
    const buf = new Uint8Array(4);
    const pts = [];
    for (let dx = -r; dx <= r; dx += Math.max(1, r / 2)) {
      for (let dy = -r; dy <= r; dy += Math.max(1, r / 2)) {
        const sx = Math.round((px + dx) * dpr), sy = Math.round((window.innerHeight - (py + dy)) * dpr);
        gl.readPixels(sx, sy, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
        pts.push([buf[0], buf[1], buf[2]]);
      }
    }
    const n = pts.length;
    const mean = [0, 0, 0];
    for (const p of pts) { mean[0] += p[0]; mean[1] += p[1]; mean[2] += p[2]; }
    mean[0] /= n; mean[1] /= n; mean[2] /= n;
    let varr = 0;
    for (const p of pts) varr += ((p[0] - mean[0]) ** 2 + (p[1] - mean[1]) ** 2 + (p[2] - mean[2]) ** 2) / 3;
    return { mean: mean.map(v => Math.round(v)), sd: Math.round(Math.sqrt(varr / n)) };
  },
  stats() { return { tris: renderer.info.render.triangles, calls: renderer.info.render.calls }; },
  start() { if (!started) { started = true; overlay.classList.add('hidden'); } }
};

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  t += dt;
  updateBus();
  updatePlayer(dt);
  updatePassage(dt);
  updateDoor(dt);
  updateWell(dt);
  updateFrogs();
  updateDragonflies();
  updateClouds();
  updateWater();
  updateLaundry();
  updateNight(dt);
  updateCeremony(dt);
  updateDawn(dt);
  updateCamera(dt);
  updateHUD();
  exportState();
  renderer.render(realm === 'day' ? scene : sceneNight, camera);
}

/* ---------------- boot ---------------- */
P.y = groundHeight(P.x, P.z);
model.position.set(P.x, P.y, P.z);
model.rotation.y = modelYaw;
applyDoorPanel();
updateBus();
snapCamera();
exportState();
if (new URLSearchParams(window.location.search).has('autostart')) {
  started = true;
  overlay.classList.add('hidden');
}
requestAnimationFrame(frame);

} catch (err) {
  const e = document.getElementById('err');
  e.style.display = 'flex';
  e.textContent = 'Failed to start: ' + err.message;
  throw err;
}
}
__boot();
</script>
